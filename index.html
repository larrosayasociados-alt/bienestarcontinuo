<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienestar continuo — L&amp;A Seguros</title>
<meta name="description" content="Carruseles de Bienestar continuo para redes. Larrosa y Asociados.">
<style>
  :root {
    --bg: #0f1419;
    --card: #1a222b;
    --line: rgba(255,255,255,.08);
    --text: #f4f1ea;
    --muted: #b7b3a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 20px 12px; max-width: 980px; margin: 0 auto; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.02em; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 18px; }
  article { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  article header { padding: 14px 16px 0; }
  article h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; padding: 12px 16px 16px; -webkit-overflow-scrolling: touch; }
  .slides img { scroll-snap-align: start; width: min(320px, 82vw); height: auto; border-radius: 10px; flex: 0 0 auto; background: #0b0f13; }
  .count { color: var(--muted); font-size: 12px; font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>Bienestar continuo</h1>
  <p>L&amp;A Seguros · 16 publicaciones listas para redes</p>
</header>
<main id="grid"></main>
<script>
const posts = [
  { id: 1, slides: 4 }, { id: 2, slides: 1 }, { id: 3, slides: 1 },
  { id: 4, slides: 3 }, { id: 5, slides: 4 }, { id: 6, slides: 1 },
  { id: 7, slides: 1 }, { id: 8, slides: 3 }, { id: 9, slides: 4 },
  { id: 10, slides: 1 }, { id: 11, slides: 1 }, { id: 12, slides: 3 },
  { id: 13, slides: 4 }, { id: 14, slides: 1 }, { id: 15, slides: 1 },
  { id: 16, slides: 3 }
];
const grid = document.getElementById('grid');
posts.forEach(p => {
  const n = String(p.id).padStart(2, '0');
  const art = document.createElement('article');
  const imgs = Array.from({ length: p.slides }, (_, i) => {
    const s = `post${n}_slide${i + 1}.png`;
    return `<img src="${s}" alt="Post ${p.id}, slide ${i + 1}" loading="lazy">`;
  }).join('');
  art.innerHTML = `<header><h2>Post ${p.id} <span class="count">· ${p.slides} ${p.slides === 1 ? 'slide' : 'slides'}</span></h2></header><div class="slides">${imgs}</div>`;
  grid.appendChild(art);
});
</script>
</body>
</html>
